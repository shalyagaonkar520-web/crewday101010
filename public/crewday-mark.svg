<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="CrewDay">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9fc1"/>
      <stop offset="50%" stop-color="#c4a5f5"/>
      <stop offset="100%" stop-color="#7cc0ff"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6fa"/>
      <stop offset="100%" stop-color="#f2f7ff"/>
    </linearGradient>
    <linearGradient id="cArc" x1="0.1" y1="0.1" x2="0.95" y2="0.9">
      <stop offset="0%" stop-color="#ff4d8d"/>
      <stop offset="45%" stop-color="#a86ce0"/>
      <stop offset="100%" stop-color="#3f9dff"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6ba1"/>
      <stop offset="100%" stop-color="#f4457f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#57b2ff"/>
      <stop offset="100%" stop-color="#2f8ef0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b48cf2"/>
      <stop offset="100%" stop-color="#9068e0"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#face)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#ring)" stroke-width="6"/>

  <!-- The crew: three figures, the middle one leading -->
  <g>
    <circle cx="66" cy="74" r="15" fill="url(#pink)"/>
    <path d="M40 116c0-15 12-25 26-25s26 10 26 25z" fill="url(#pink)"/>

    <circle cx="134" cy="74" r="15" fill="url(#violet)"/>
    <path d="M108 116c0-15 12-25 26-25s26 10 26 25z" fill="url(#violet)"/>

    <circle cx="100" cy="58" r="20" fill="url(#blue)" stroke="#fff6fa" stroke-width="4"/>
    <path d="M66 106c0-19 15-31 34-31s34 12 34 31z" fill="url(#blue)" stroke="#fff6fa" stroke-width="4"/>
  </g>

  <!-- Radiating marks -->
  <g stroke-linecap="round" stroke-width="7" opacity="0.95">
    <path d="M38 72l14 9" stroke="#ff6ba1"/>
    <path d="M30 96h16" stroke="#57b2ff"/>
    <path d="M38 120l14-9" stroke="#b48cf2"/>
    <path d="M162 72l-14 9" stroke="#ff6ba1"/>
    <path d="M170 96h-16" stroke="#57b2ff"/>
    <path d="M162 120l-14-9" stroke="#b48cf2"/>
  </g>

  <!-- The C, open to the right -->
  <path d="M148 84a46 46 0 1 0 0 56" fill="none" stroke="url(#cArc)" stroke-width="21"
        stroke-linecap="round"/>

  <!-- Chat bubble inside the C -->
  <path d="M76 96h48a11 11 0 0 1 11 11v18a11 11 0 0 1-11 11h-20l-12 12v-12h-16a11 11 0 0 1-11-11v-18a11 11 0 0 1 11-11z"
        fill="#ffffff"/>
  <g fill="#4a9eff">
    <circle cx="86" cy="116" r="5.5"/>
    <circle cx="100" cy="116" r="5.5"/>
    <circle cx="114" cy="116" r="5.5"/>
  </g>
</svg>
