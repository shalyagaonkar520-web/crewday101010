apply plugin: 'com.android.application'

// Release signing credentials: android/keystore.properties (untracked) first,
// then environment variables. If neither is present the release build is
// simply left unsigned -- configuration never fails.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String propKey, String envKey ->
    def v = keystoreProps.getProperty(propKey) ?: System.getenv(envKey)
    return v ? v.trim() : null
}
def releaseStoreFile = signingValue('storeFile', 'CREWDAY_STORE_FILE')
def releaseStorePassword = signingValue('storePassword', 'CREWDAY_STORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'CREWDAY_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'CREWDAY_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

// Defaults are the current release; override per build with
// -PversionCode=3 -PversionName=1.1.1. Play needs a higher versionCode on every
// upload, so bump the code here (and package.json's version) with each release.
// Computed up front: `versionCode (expr).toInteger()` would be parsed by Groovy as
// a call to versionCode(...) followed by .toInteger() on its null result.
def appVersionCode = (project.findProperty('versionCode') ?: '2').toString().toInteger()
def appVersionName = (project.findProperty('versionName') ?: '1.1.0').toString()

android {
    namespace = "app.crewday"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.crewday"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                // Relative paths in keystore.properties resolve against android/.
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            // R8 left off on purpose: Capacitor reaches plugins and the JS bridge
            // by reflection/annotations, and a broken release matters more than
            // a smaller bundle. Revisit only with a device-tested build.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
