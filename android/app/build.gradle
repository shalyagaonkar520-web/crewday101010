plugins {
    id("com.android.application")
    id("com.google.gms.google-services")
}

/**
 * Release signing.
 *
 * Play Console only accepts an upload signed with *your* key, and that key can
 * never be replaced once the app is live — so its details live in
 * `android/keystore.properties`, which is gitignored and never leaves this
 * machine (or in CREWDAY_* environment variables). Without either, the release
 * build is left unsigned, so a fresh clone still builds but Play will reject it.
 *
 * See PLAY_STORE.md for how to create the keystore.
 */
// Release signing credentials: android/keystore.properties (untracked) first,
// then environment variables. If neither is present the release build is
// simply left unsigned -- configuration never fails.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String propKey, String envKey ->
    def v = keystoreProps.getProperty(propKey) ?: System.getenv(envKey)
    return v ? v.trim() : null
}
def releaseStoreFile = signingValue('storeFile', 'CREWDAY_STORE_FILE')
def releaseStorePassword = signingValue('storePassword', 'CREWDAY_STORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'CREWDAY_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'CREWDAY_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "app.crewday"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.crewday"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play rejects an upload whose versionCode it has seen before (2 is
        // already on Play). Override per build with -PversionCode=4 -PversionName=1.3.
        versionCode (project.findProperty('versionCode') ?: '3').toInteger()
        versionName (project.findProperty('versionName') ?: '1.2')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                // Relative paths in keystore.properties resolve against android/.
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            // R8 left off on purpose: Capacitor reaches plugins and the JS bridge
            // by reflection/annotations, and a broken release matters more than
            // a smaller bundle. Revisit only with a device-tested build.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.19.0')

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
