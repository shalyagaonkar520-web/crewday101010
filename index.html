<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/crewday-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF7FB" />
    <title>CrewDay — Find your crew. Make your day.</title>
    <meta
      name="description"
      content="CrewDay helps you discover people, hobbies, activities and events happening around you. Join as a participant or as audience."
    />
    <meta property="og:title" content="CrewDay — Find your crew. Make your day." />
    <meta
      property="og:description"
      content="Discover people, hobbies, activities and events happening around you."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #fdf7fb;
        font-family: 'Poppins', system-ui, sans-serif;
        transition: opacity 0.35s ease;
      }
      #splash.is-done { opacity: 0; pointer-events: none; }
      #splash svg { animation: splash-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      #splash-word { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
      #splash-word span:first-child { color: #ff4d8d; }
      #splash-word span:last-child { color: #4a9eff; }
      #splash-bar {
        width: 120px; height: 4px; border-radius: 999px;
        background: #ffe3ed; overflow: hidden;
      }
      #splash-bar i {
        display: block; width: 40%; height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, #ff4d8d, #4a9eff);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.88); } to { opacity: 1; transform: none; } }
      @keyframes splash-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash svg, #splash-bar i { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Pre-React splash.

      Between the HTML arriving and React mounting there is a gap — longer on a
      cold cache or a slow phone — and without this the page is blank white,
      which reads as "broken" rather than "loading". Inline so it needs no
      extra request, and removed by the app once it has mounted.
    -->
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 200 200" width="88" height="88">
        <defs>
          <linearGradient id="s-ring" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff9fc1"/><stop offset="50%" stop-color="#c4a5f5"/><stop offset="100%" stop-color="#7cc0ff"/>
          </linearGradient>
          <linearGradient id="s-arc" x1="0.1" y1="0.1" x2="0.95" y2="0.9">
            <stop offset="0%" stop-color="#ff4d8d"/><stop offset="45%" stop-color="#a86ce0"/><stop offset="100%" stop-color="#3f9dff"/>
          </linearGradient>
          <linearGradient id="s-pink" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ff6ba1"/><stop offset="100%" stop-color="#f4457f"/>
          </linearGradient>
          <linearGradient id="s-blue" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#57b2ff"/><stop offset="100%" stop-color="#2f8ef0"/>
          </linearGradient>
          <linearGradient id="s-violet" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b48cf2"/><stop offset="100%" stop-color="#9068e0"/>
          </linearGradient>
        </defs>
        <circle cx="100" cy="100" r="95" fill="#fffafd"/>
        <circle cx="100" cy="100" r="95" fill="none" stroke="url(#s-ring)" stroke-width="6"/>
        <circle cx="66" cy="74" r="15" fill="url(#s-pink)"/>
        <path d="M40 116c0-15 12-25 26-25s26 10 26 25z" fill="url(#s-pink)"/>
        <circle cx="134" cy="74" r="15" fill="url(#s-violet)"/>
        <path d="M108 116c0-15 12-25 26-25s26 10 26 25z" fill="url(#s-violet)"/>
        <circle cx="100" cy="58" r="20" fill="url(#s-blue)" stroke="#fffafd" stroke-width="4"/>
        <path d="M66 106c0-19 15-31 34-31s34 12 34 31z" fill="url(#s-blue)" stroke="#fffafd" stroke-width="4"/>
        <path d="M148 84a46 46 0 1 0 0 56" fill="none" stroke="url(#s-arc)" stroke-width="21" stroke-linecap="round"/>
        <path d="M76 96h48a11 11 0 0 1 11 11v18a11 11 0 0 1-11 11h-20l-12 12v-12h-16a11 11 0 0 1-11-11v-18a11 11 0 0 1 11-11z" fill="#ffffff"/>
        <circle cx="86" cy="116" r="5.5" fill="#4a9eff"/>
        <circle cx="100" cy="116" r="5.5" fill="#4a9eff"/>
        <circle cx="114" cy="116" r="5.5" fill="#4a9eff"/>
      </svg>
      <div id="splash-word"><span>CREW</span><span>DAY</span></div>
      <div id="splash-bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
